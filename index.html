
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>ECO AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f9f5;
      color: #173b30;
      text-align: center;
    }
    header {
      background: #087f5b;
      color: white;
      padding: 40px 20px;
    }
    main { padding: 50px 20px; }
    .card {
      background: white;
      max-width: 600px;
      margin: auto;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px #0001;
    }
    button {
      background: #087f5b;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 14px 24px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌱 AI ECO FILTER</h1>
    <p>Smart Learning Assistant</p>
  </header>
  <main>
    <div class="card">
      <h2>Selamat Datang!</h2>
      <p>
        Belajar lebih mudah dengan
        teknologi kecerdasan buatan.
      </p>
      <button onclick="alert('AI segera hadir!')">
        Mulai Belajar
      </button>
    </div>
  </main>
</body>
</html>
